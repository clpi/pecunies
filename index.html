<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pecunies</title>
    <link rel="stylesheet" href="/src/journal.css" />
  </head>
  <body class="journal">
    <div class="journal-shell" id="journal">
      <header class="journal-header">
        <a class="journal-name" href="/" aria-label="Pecunies home">Pecunies</a>
        <nav aria-label="Site">
          <a href="/" id="nav-posts" aria-current="page">Posts</a>
          <a href="/about" id="nav-about">Contact / About</a>
        </nav>
      </header>
      <main>
        <section id="posts-view" aria-labelledby="posts-heading">
          <h1 id="posts-heading">Posts</h1>
          <nav aria-label="Post filters">
            <a href="/papers" id="filter-papers">Papers</a>
            <a href="/" id="filter-posts" aria-current="page">Posts</a>
          </nav>
          <ul id="papers-list" aria-label="Generated papers" hidden></ul>
          <ul id="posts-list" aria-label="Handwritten posts"></ul>
        </section>
        <section id="about-view" aria-labelledby="about-heading" hidden>
          <h1 id="about-heading">Chris Pecunies</h1>
          <address>
            <a href="mailto:chris@pecunies.com">chris@pecunies.com</a>
            <a href="https://github.com/clpi">GitHub</a>
          </address>
        </section>
      </main>
    </div>
    <div id="app" hidden></div>
    <script type="module" src="/src/front.ts"></script>
  </body>
</html>
